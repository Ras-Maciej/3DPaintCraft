<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="eraserBody" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="100%" stop-color="#ff9eb5"/>
    </linearGradient>
    <linearGradient id="eraserTip" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d0d5dd"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- Eraser Block Base (Beveled rubber) -->
  <polygon points="12,46 26,54 48,32 34,24" fill="url(#eraserBody)" stroke="#ba3f56" stroke-width="1.5"/>
  <!-- Front Edge / Bevel -->
  <polygon points="26,54 36,44 48,32 34,24" fill="#ff5c77" opacity="0.3"/>
  <!-- Rubber Top Half -->
  <polygon points="34,24 48,32 54,26 40,18" fill="url(#eraserTip)" stroke="#808899" stroke-width="1.5"/>
  <!-- Paper Sleeve Band -->
  <polygon points="22,36 30,28 38,36 30,44" fill="#3a7bd5" stroke="#1f4f8e" stroke-width="1.2"/>
  <!-- Erasing Dust Particles -->
  <circle cx="10" cy="50" r="1.5" fill="#e0e4ec"/>
  <circle cx="16" cy="56" r="1.2" fill="#e0e4ec"/>
  <circle cx="8" cy="42" r="1.0" fill="#e0e4ec"/>
  <!-- Erase motion lines -->
  <line x1="8" y1="56" x2="18" y2="58" stroke="#f35e18" stroke-width="1.5" stroke-linecap="round"/>
</svg>
