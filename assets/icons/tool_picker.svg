<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dropperBulb" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f35e18"/>
      <stop offset="100%" stop-color="#ffa166"/>
    </linearGradient>
  </defs>
  <!-- Rubber Squeeze Bulb -->
  <path d="M 44 14 C 42 10, 48 4, 52 8 C 56 12, 50 18, 46 16 Z" fill="url(#dropperBulb)" stroke="#b84508" stroke-width="1.5"/>
  <ellipse cx="49" cy="11" rx="6" ry="4" fill="url(#dropperBulb)" stroke="#b84508" stroke-width="1.5" transform="rotate(-45 49 11)"/>
  <rect x="42" y="16" width="6" height="3" rx="1" fill="#4a5568" transform="rotate(-45 45 17.5)"/>
  
  <!-- Glass Pipette Barrel -->
  <polygon points="41,19 45,23 27,41 23,37" fill="#e2e8f0" stroke="#718096" stroke-width="1.2" opacity="0.9"/>
  <!-- Liquid Column inside glass -->
  <polygon points="36,24 39,27 27,39 24,36" fill="#f35e18" opacity="0.85"/>
  <!-- Dropper Tapered Tip -->
  <polygon points="23,37 27,41 16,48 14,46" fill="#cbd5e1" stroke="#718096" stroke-width="1.2"/>
  
  <!-- Suspended Droplet at Tip -->
  <path d="M 12 52 C 12 50, 14 48, 14 46 C 14 48, 16 50, 16 52 C 16 54, 14.5 56, 14 56 C 13.5 56, 12 54, 12 52 Z" fill="#f35e18"/>
  <circle cx="13.5" cy="51" r="0.8" fill="#ffffff"/>
  
  <!-- Target Reticle at Sample Point -->
  <circle cx="14" cy="56" r="4.5" fill="none" stroke="#00d2ff" stroke-width="1.2" stroke-dasharray="2,2"/>
</svg>
