<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d495c"/>
      <stop offset="100%" stop-color="#232b38"/>
    </linearGradient>
  </defs>
  <!-- 3D Isometric Cube -->
  <!-- Top Face -->
  <polygon points="34,22 52,31 34,40 16,31" fill="url(#cubeTop)" stroke="#718096" stroke-width="1.2"/>
  <!-- Left Face -->
  <polygon points="16,31 34,40 34,58 16,49" fill="url(#cubeLeft)" stroke="#718096" stroke-width="1.2"/>
  <!-- Right Face -->
  <polygon points="34,40 52,31 52,49 34,58" fill="url(#cubeRight)" stroke="#718096" stroke-width="1.2"/>
  
  <!-- Optical Projector Beam (Cyan & Orange) -->
  <polygon points="8,10 26,20 22,28 6,16" fill="#f35e18" opacity="0.85"/>
  <circle cx="8" cy="13" r="3.5" fill="#ffa166"/>
  <!-- Projection Rays -->
  <line x1="24" y1="22" x2="32" y2="30" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="26" y1="26" x2="30" y2="42" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Projected Stamp Ring on 3D Surface -->
  <ellipse cx="32" cy="33" rx="7" ry="4" fill="none" stroke="#f35e18" stroke-width="1.8"/>
  <circle cx="32" cy="33" r="1.5" fill="#f35e18"/>
</svg>
