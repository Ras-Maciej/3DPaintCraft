      <stop offset="0%" stop-color="#4a3b32"/>
      <stop offset="100%" stop-color="#8c6d58"/>
    </linearGradient>
    <linearGradient id="brushTip" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e25b10"/>
